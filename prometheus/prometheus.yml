global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    # DNS A-record discovery returns one target per scaled replica
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
