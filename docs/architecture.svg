<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Helvetica, Arial, sans-serif" font-size="15">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16233b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8599"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c43a22"/></marker></defs>
<rect width="1240" height="640" fill="#fff"/>
<rect x="180" y="50" width="220" height="330" rx="8" fill="#eef4fb" stroke="#3b6fb6" stroke-width="2" stroke-dasharray="8 5"/><text x="290.0" y="74" text-anchor="middle" font-weight="700" fill="#3b6fb6" font-size="14">1: front door</text><rect x="420" y="50" width="200" height="330" rx="8" fill="#f4f0fa" stroke="#7b56b3" stroke-width="2" stroke-dasharray="8 5"/><text x="520.0" y="74" text-anchor="middle" font-weight="700" fill="#7b56b3" font-size="14">2: shared state</text><rect x="660" y="50" width="320" height="330" rx="8" fill="#eef7f1" stroke="#2a7a55" stroke-width="2" stroke-dasharray="8 5"/><text x="820.0" y="74" text-anchor="middle" font-weight="700" fill="#2a7a55" font-size="14">3: workers (can be scaled)</text><rect x="1010" y="50" width="210" height="330" rx="8" fill="#fcf6e8" stroke="#b07a1a" stroke-width="2" stroke-dasharray="8 5"/><text x="1115.0" y="74" text-anchor="middle" font-weight="700" fill="#b07a1a" font-size="14">4: rulebook</text>
<rect x="20" y="190" width="130" height="70" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="85.0" y="216" text-anchor="middle" font-weight="700">Browser</text><text x="85.0" y="240" text-anchor="middle" fill="#5a6679" font-size="14">the web page</text>
<rect x="192" y="150" width="196" height="150" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="290.0" y="176" text-anchor="middle" font-weight="700">api (FastAPI)</text><text x="290.0" y="200" text-anchor="middle" fill="#5a6679" font-size="14">checks the numbers</text><text x="290.0" y="222" text-anchor="middle" fill="#5a6679" font-size="14">limits requests</text><text x="290.0" y="244" text-anchor="middle" fill="#5a6679" font-size="14">remembers repeats</text><text x="290.0" y="266" text-anchor="middle" fill="#5a6679" font-size="14">sets bad data aside</text>
<rect x="435" y="130" width="170" height="190" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="520.0" y="156" text-anchor="middle" font-weight="700">redis</text><text x="520.0" y="180" text-anchor="middle" fill="#5a6679" font-size="14">waiting line (queue)</text><text x="520.0" y="202" text-anchor="middle" fill="#5a6679" font-size="14">finished answers</text><text x="520.0" y="224" text-anchor="middle" fill="#5a6679" font-size="14">repeat answers</text><text x="520.0" y="246" text-anchor="middle" fill="#5a6679" font-size="14">set-aside requests</text>
<rect x="675" y="95" width="290" height="62" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="820.0" y="121" text-anchor="middle" font-weight="700">Researcher</text><text x="820.0" y="145" text-anchor="middle" fill="#5a6679" font-size="14">searches the rulebook</text>
<rect x="675" y="185" width="290" height="62" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="820.0" y="211" text-anchor="middle" font-weight="700">Assessor</text><text x="820.0" y="235" text-anchor="middle" fill="#5a6679" font-size="14">judges each rule, quotes it</text>
<rect x="675" y="275" width="290" height="62" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="820.0" y="301" text-anchor="middle" font-weight="700">Checker (plain code)</text><text x="820.0" y="325" text-anchor="middle" fill="#5a6679" font-size="14">quotes real? rules covered?</text>
<rect x="1025" y="95" width="180" height="62" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="1115.0" y="121" text-anchor="middle" font-weight="700">FAISS index</text><text x="1115.0" y="145" text-anchor="middle" fill="#5a6679" font-size="14">the searchable rules</text>
<rect x="1025" y="215" width="180" height="62" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="1115.0" y="241" text-anchor="middle" font-weight="700">indexer</text><text x="1115.0" y="265" text-anchor="middle" fill="#5a6679" font-size="14">builds it once</text>
<rect x="675" y="430" width="290" height="70" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="820.0" y="456" text-anchor="middle" font-weight="700">AI model</text><text x="820.0" y="480" text-anchor="middle" fill="#5a6679" font-size="14">stub today; a real one via .env</text>
<rect x="180" y="430" width="440" height="120" rx="8" fill="#fff" stroke="#16233b" stroke-width="2"/><text x="400.0" y="456" text-anchor="middle" font-weight="700">Watching it work</text><text x="400.0" y="480" text-anchor="middle" fill="#5a6679" font-size="14">prometheus + grafana: numbers, charts</text><text x="400.0" y="502" text-anchor="middle" fill="#5a6679" font-size="14">jaeger: one check, step by step</text><text x="400.0" y="524" text-anchor="middle" fill="#5a6679" font-size="14">logs with one ID per request</text>
<path d="M805 157V185" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/><path d="M805 247V275" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M965 306H974V130H968" stroke="#c43a22" stroke-width="2" fill="none" marker-end="url(#r)"/>
<text x="820" y="358" text-anchor="middle" fill="#c43a22" font-size="13">gap found: search again (2 tries max),</text>
<text x="820" y="374" text-anchor="middle" fill="#c43a22" font-size="13">otherwise ask a person</text>
<path d="M965 112H1025" stroke="#7a8599" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)" fill="none"/><path d="M1115 215V157" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M150 215H192" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="171" y="206" text-anchor="middle" font-size="13" font-weight="700">1</text>
<path d="M192 245H150" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="171" y="262" text-anchor="middle" font-size="13" font-weight="700">5</text>
<path d="M388 215H435" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="411" y="206" text-anchor="middle" font-size="13" font-weight="700">2</text>
<path d="M605 225H675" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="640" y="216" text-anchor="middle" font-size="13" font-weight="700">3</text>
<path d="M675 306H640V285H605" stroke="#16233b" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="652" y="328" text-anchor="middle" font-size="13" font-weight="700">4</text>
<path d="M930 337V430" stroke="#7a8599" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)" fill="none"/><text x="920" y="402" text-anchor="end" fill="#5a6679" font-size="13">retries, timeouts, circuit breaker</text>
<path d="M290 300V430" stroke="#7a8599" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)" fill="none"/>
<path d="M690 380V490H620" stroke="#7a8599" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)" fill="none"/>
<text x="620" y="595" text-anchor="middle" fill="#16233b" font-size="14">1 send the numbers  |  2 queue the job  |  3 a worker takes it  |  4 store the answer  |  5 the page asks until it is ready</text>
<text x="620" y="618" text-anchor="middle" fill="#5a6679" font-size="13">solid arrow: the request  |  dashed arrow: side connection  |  dashed boxes: deployment boundaries</text>
</svg>